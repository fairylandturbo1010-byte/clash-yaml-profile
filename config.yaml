# ============================================================
#  Clash YAML Profile
#  Personal Clash / Mihomo rule-based config
#
#  [Rule priority] rules are matched top to bottom
#   1. Adobe (all domains)   -> blocked (REJECT / 🛑 Block)
#   2. LAN / local traffic   -> DIRECT
#   3. AI services           -> OpenAI / Claude / Gemini groups, US by default
#   4. Streaming             -> Asia nodes by default (JP / HK / SG / KR / TW)
#   5. Mainland China        -> DIRECT
#   6. Everything else       -> 🚀 Node Select (manual switch)
#
#   NOTE: US nodes are used for AI services by default, to reduce the risk of
#         account risk-control triggered by frequent region switching.
#   NOTE: all group names are in English. Clash rules are comma-separated,
#         so a group name must never contain a comma.
#
#  [Tested clients]
#   Clash Verge Rev / Mihomo Party / FlClash / Clash Meta
# ============================================================

# ---------- General ----------
mixed-port: 7890          # HTTP / SOCKS5 port
allow-lan: false          # allow other devices on the LAN to connect
mode: rule                # rule / global / direct
log-level: info
ipv6: false
unified-delay: true       # unified delay display (closer to real experience)
tcp-concurrent: true      # TCP concurrent connections, faster first byte
# external-controller: 127.0.0.1:9090   # uncomment for the web dashboard

# Remember the selected node across client restarts
profile:
  store-selected: true
  store-fake-ip: true

# ---------- DNS ----------
dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  fallback:
    - 1.1.1.1
    - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
      - "+.openai.com"
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "time.windows.com"
    - "time.nist.gov"
    - "time.apple.com"
  nameserver-policy:
    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29

# ============================================================
#  >>>>>>>>>>>>>>>>>>  Subscription URL  <<<<<<<<<<<<<<<<<<<<
#  When changing provider, only edit the url below.
#  interval: update interval in seconds, 172800 = 48h = every 2 days
# ============================================================
proxy-providers:
  Provider:
    type: http
    url: "https://liangxin.xyz/api/v1/liangxin?OwO=6d6fd6109c7631b213e1a320ef1645db"
    interval: 172800
    path: ./providers/provider.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

# ---------- Proxy groups ----------
proxy-groups:
  # Default outbound: all foreign traffic not matched by China rules
  - name: 🚀 Node Select
    type: select
    proxies:
      - ♻️ Auto Select
      - 🌏 Asia
      - 🇯🇵 Japan
      - 🇭🇰 Hong Kong
      - 🇸🇬 Singapore
      - 🇰🇷 South Korea
      - 🇨🇳 Taiwan(China)
      - 🇺🇸 United States
      - 🇬🇧 United Kingdom
      - 🌍 Streaming
      - 🤖 AI
      - 🎯 CN Direct
      - 🛑 Block
    use:
      - Provider

  # Auto speed test, picks the lowest latency node
  - name: ♻️ Auto Select
    type: url-test
    use:
      - Provider
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # ---------- Region node pools (by country / region) ----------
  # Nodes are grouped by the filter regex matching node names,
  # and the fastest node of that region is selected automatically.
  # If your provider names regions differently, adjust the regex.

  # Asia: Japan / Hong Kong / Singapore / South Korea / Taiwan
  - name: 🌏 Asia
    type: url-test
    use:
      - Provider
    filter: '(?i)日本|香港|新加坡|韩国|台湾|台灣|Japan|Hong ?Kong|Singapore|Korea|Taiwan'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇯🇵 Japan
    type: url-test
    use:
      - Provider
    filter: '(?i)\bJP\b|日本|东京|大阪|名古屋|Japan|Tokyo|Osaka|Nagoya'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇭🇰 Hong Kong
    type: url-test
    use:
      - Provider
    filter: '(?i)\bHK\b|香港|Hong ?Kong'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇸🇬 Singapore
    type: url-test
    use:
      - Provider
    filter: '(?i)\bSG\b|新加坡|狮城|Singapore'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇰🇷 South Korea
    type: url-test
    use:
      - Provider
    filter: '(?i)\bKR\b|韩国|首尔|Korea|Seoul'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇨🇳 Taiwan(China)
    type: url-test
    use:
      - Provider
    filter: '(?i)\bTW\b|台湾|台灣|台北|Taiwan|Taipei'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇺🇸 United States
    type: url-test
    use:
      - Provider
    filter: '(?i)\bUS\b|\bUSA\b|美国|美西|美东|洛杉矶|圣何塞|硅谷|纽约|达拉斯|Los Angeles|San Jose|Silicon|New York|Dallas'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇬🇧 United Kingdom
    type: url-test
    use:
      - Provider
    filter: '(?i)\bUK\b|\bGB\b|英国|伦敦|United Kingdom|Britain|London'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # ---------- Purpose groups ----------

  # Streaming: Asia by default, switchable to JP / HK / SG / Auto / Direct
  - name: 🌍 Streaming
    type: select
    proxies:
      - 🌏 Asia
      - 🇯🇵 Japan
      - 🇭🇰 Hong Kong
      - 🇸🇬 Singapore
      - ♻️ Auto Select
      - 🎯 CN Direct

  # Generic AI outbound: US by default
  - name: 🤖 AI
    type: select
    proxies:
      - 🇺🇸 United States
      - ♻️ Auto Select

  # OpenAI / ChatGPT - Hong Kong is not officially supported, so it is not offered
  - name: 🤖 OpenAI
    type: select
    proxies:
      - 🇺🇸 United States   # default
      - 🇯🇵 Japan
      - 🇸🇬 Singapore
      - 🇰🇷 South Korea
      - 🇨🇳 Taiwan(China)
      - 🇬🇧 United Kingdom
      - ♻️ Auto Select

  # Anthropic / Claude - Hong Kong is not officially supported, so it is not offered
  - name: 🤖 Claude
    type: select
    proxies:
      - 🇺🇸 United States   # default
      - 🇬🇧 United Kingdom
      - 🇯🇵 Japan
      - 🇸🇬 Singapore
      - 🇰🇷 South Korea
      - 🇨🇳 Taiwan(China)
      - ♻️ Auto Select

  # Google Gemini - Hong Kong is officially supported, so it is kept
  - name: 🤖 Gemini
    type: select
    proxies:
      - 🇺🇸 United States   # default
      - 🇬🇧 United Kingdom
      - 🇯🇵 Japan
      - 🇭🇰 Hong Kong
      - 🇸🇬 Singapore
      - 🇰🇷 South Korea
      - 🇨🇳 Taiwan(China)
      - ♻️ Auto Select

  # Mainland China direct
  - name: 🎯 CN Direct
    type: select
    proxies:
      - DIRECT

  # Block (Adobe offline)
  - name: 🛑 Block
    type: select
    proxies:
      - REJECT

# ---------- Rules (matched top to bottom, order matters) ----------
rules:
  # ===== 1. Adobe: blocked entirely (highest priority) =====
  # NOTE: these rules block every Adobe domain, the apps will be fully offline.
  #       If you buy a genuine Adobe license later, delete this whole block.
  # Keyword fallback: any domain containing "adobe" is blocked
  - DOMAIN-KEYWORD,adobe,🛑 Block
  # ---- Adobe main domains ----
  - DOMAIN-SUFFIX,adobe.com,🛑 Block
  - DOMAIN-SUFFIX,adobe.net,🛑 Block
  - DOMAIN-SUFFIX,adobe.io,🛑 Block
  - DOMAIN-SUFFIX,adobe-dns.com,🛑 Block
  - DOMAIN-SUFFIX,adobelogin.com,🛑 Block
  - DOMAIN-SUFFIX,adobess.com,🛑 Block
  - DOMAIN-SUFFIX,adobegenuine.com,🛑 Block
  - DOMAIN-SUFFIX,adobespark.com,🛑 Block
  - DOMAIN-SUFFIX,adobestock.com,🛑 Block
  - DOMAIN-SUFFIX,adobefonts.com,🛑 Block
  - DOMAIN-SUFFIX,adobeconnect.com,🛑 Block
  - DOMAIN-SUFFIX,adobeexchange.com,🛑 Block
  - DOMAIN-SUFFIX,adobecqms.net,🛑 Block
  - DOMAIN-SUFFIX,adobedtm.com,🛑 Block
  - DOMAIN-SUFFIX,adobestatic.com,🛑 Block
  - DOMAIN-SUFFIX,adobecc.com,🛑 Block
  - DOMAIN-SUFFIX,creativecloud.com,🛑 Block
  # ---- Adobe related / acquired products ----
  - DOMAIN-SUFFIX,behance.net,🛑 Block
  - DOMAIN-SUFFIX,behance.com,🛑 Block
  - DOMAIN-SUFFIX,photoshop.com,🛑 Block
  - DOMAIN-SUFFIX,magento.com,🛑 Block
  - DOMAIN-SUFFIX,marketo.com,🛑 Block
  - DOMAIN-SUFFIX,echosign.com,🛑 Block
  - DOMAIN-SUFFIX,typekit.com,🛑 Block
  - DOMAIN-SUFFIX,typekit.net,🛑 Block
  - DOMAIN-SUFFIX,scene7.com,🛑 Block
  # ---- Adobe Analytics / tracking ----
  - DOMAIN-SUFFIX,omniture.com,🛑 Block
  - DOMAIN-SUFFIX,omtrdc.net,🛑 Block
  - DOMAIN-SUFFIX,demdex.net,🛑 Block
  - DOMAIN-SUFFIX,everesttech.net,🛑 Block
  - DOMAIN-SUFFIX,2o7.net,🛑 Block
  - DOMAIN-SUFFIX,adobestats.io,🛑 Block

  # ===== 2. LAN / local traffic -> DIRECT =====
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  # ===== 3. AI services: dedicated groups, US by default =====
  # OpenAI / ChatGPT (no Hong Kong)
  - GEOSITE,openai,🤖 OpenAI
  - DOMAIN-SUFFIX,openai.com,🤖 OpenAI
  - DOMAIN-SUFFIX,chatgpt.com,🤖 OpenAI
  - DOMAIN-SUFFIX,oaistatic.com,🤖 OpenAI
  - DOMAIN-SUFFIX,oaiusercontent.com,🤖 OpenAI
  - DOMAIN-SUFFIX,sora.com,🤖 OpenAI
  # Anthropic / Claude (no Hong Kong)
  - DOMAIN-SUFFIX,anthropic.com,🤖 Claude
  - DOMAIN-SUFFIX,claude.ai,🤖 Claude
  - DOMAIN-SUFFIX,claudeusercontent.com,🤖 Claude
  # Google Gemini (Hong Kong supported)
  - DOMAIN-SUFFIX,gemini.google.com,🤖 Gemini
  - DOMAIN-SUFFIX,bard.google.com,🤖 Gemini
  - DOMAIN-SUFFIX,aistudio.google.com,🤖 Gemini
  - DOMAIN-SUFFIX,deepmind.google,🤖 Gemini
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,🤖 Gemini
  # Other AI services -> generic AI outbound (US)
  - DOMAIN-SUFFIX,perplexity.ai,🤖 AI
  - DOMAIN-SUFFIX,huggingface.co,🤖 AI
  - DOMAIN-SUFFIX,midjourney.com,🤖 AI
  - DOMAIN-SUFFIX,copilot.microsoft.com,🤖 AI
  - DOMAIN-SUFFIX,copilot.github.com,🤖 AI
  - DOMAIN-SUFFIX,blackbox.ai,🤖 AI
  - DOMAIN-SUFFIX,groq.com,🤖 AI
  - DOMAIN-SUFFIX,mistral.ai,🤖 AI
  - DOMAIN-SUFFIX,cohere.com,🤖 AI
  - DOMAIN-SUFFIX,poe.com,🤖 AI
  - DOMAIN-SUFFIX,x.ai,🤖 AI
  - DOMAIN-SUFFIX,grok.com,🤖 AI

  # ===== 4. Streaming: Asia nodes (US avoided by default) =====
  - GEOSITE,youtube,🌍 Streaming
  - GEOSITE,netflix,🌍 Streaming
  - GEOSITE,disney,🌍 Streaming
  - GEOSITE,spotify,🌍 Streaming
  - DOMAIN-SUFFIX,pinterest.com,🌍 Streaming
  - DOMAIN-SUFFIX,pinimg.com,🌍 Streaming
  - DOMAIN-SUFFIX,instagram.com,🌍 Streaming
  - DOMAIN-SUFFIX,cdninstagram.com,🌍 Streaming
  - DOMAIN-SUFFIX,twitch.tv,🌍 Streaming
  - DOMAIN-SUFFIX,dailymotion.com,🌍 Streaming
  - DOMAIN-SUFFIX,tiktok.com,🌍 Streaming
  - DOMAIN-SUFFIX,tiktokcdn.com,🌍 Streaming
  - DOMAIN-SUFFIX,tiktokcdn-us.com,🌍 Streaming
  - DOMAIN-SUFFIX,pixiv.net,🌍 Streaming
  - DOMAIN-SUFFIX,pximg.net,🌍 Streaming

  # ===== 5. Mainland China traffic -> DIRECT =====
  - GEOSITE,cn,🎯 CN Direct
  - GEOIP,CN,🎯 CN Direct,no-resolve

  # ===== 6. Fallback: everything else uses the default proxy =====
  - MATCH,🚀 Node Select
