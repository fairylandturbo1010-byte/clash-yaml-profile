# ====================================================================
# Company Profile - Clash 配置文件
# ====================================================================
# 说明：
#   1. 订阅链接已内置（proxy-providers -> Company-Profile -> url）
#   2. 国内网站/应用 → 直连
#   3. AI 服务(OpenAI/Gemini等) → 美国节点
#   4. 流媒体(YouTube/Instagram等) → 亚洲节点(避开美国)
#   5. 节点按国家/地区细分分组，自动选最低延迟
#   6. 兜底规则可手动选择任意节点/分组
#   7. 订阅每 2 天(48小时)更新一次
#   8. Adobe 全线产品 → 断网(REJECT)
# ====================================================================

# ======================== 基础设置 ========================
mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: '127.0.0.1:9090'

# ======================== DNS 设置 ========================
dns:
  enable: true
  ipv6: false
  default-nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  nameserver: [223.5.5.5, 119.29.29.29, 114.114.114.114]
  fallback: [1.1.1.1, 8.8.8.8]
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr: [240.0.0.0/4]
    domain: [+.google.com, +.facebook.com, +.youtube.com, +.openai.com]

# ====================================================================
# >>>>>>>>>>>>>>>>>>> 订阅链接配置位置 <<<<<<<<<<<<<<<<<<<
# 如需更换订阅，请修改下方 url 的值（替换整段链接即可）
# interval: 订阅更新间隔（秒），172800 = 48小时 = 每2天更新一次
# ====================================================================
proxy-providers:
  Company-Profile:
    type: http
    url: "https://liangxin.xyz/api/v1/liangxin?OwO=6d6fd6109c7631b213e1a320ef1645db"
    interval: 172800
    path: ./proxy_providers/company-profile.yaml
    health-check:
      enable: true
      interval: 600
      lazy: true
      url: http://www.gstatic.com/generate_204

# ======================== 代理组 ========================
proxy-groups:
  # 总入口：手动选择任意分组/节点
  - name: "🚀 手动选择"
    type: select
    use:
      - Company-Profile
    proxies:
      - "♻️ 自动选择"
      - "🌏 亚洲"
      - "🇯🇵 日本"
      - "🇭🇰 香港"
      - "🇸🇬 新加坡"
      - "🇰🇷 韩国"
      - "🇨🇳 台湾"
      - "🇺🇸 美国"
      - "🇬🇧 英国"
      - "DIRECT"

  # 自动选择：全部节点，按最低延迟自动切换
  - name: "♻️ 自动选择"
    type: url-test
    use:
      - Company-Profile
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # 亚洲（洲级汇总）：自动选亚洲最低延迟节点
  - name: "🌏 亚洲"
    type: url-test
    use:
      - Company-Profile
    filter: "(日本|香港|新加坡|韩国|台湾)"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # ==================== 国家/地区分组 ====================
  # 每个国家/地区一个分组，自动选该地区最低延迟节点

  - name: "🇯🇵 日本"
    type: url-test
    use:
      - Company-Profile
    filter: "日本"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇭🇰 香港"
    type: url-test
    use:
      - Company-Profile
    filter: "香港"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇸🇬 新加坡"
    type: url-test
    use:
      - Company-Profile
    filter: "新加坡"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇰🇷 韩国"
    type: url-test
    use:
      - Company-Profile
    filter: "韩国"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇨🇳 台湾"
    type: url-test
    use:
      - Company-Profile
    filter: "台湾"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇺🇸 美国"
    type: url-test
    use:
      - Company-Profile
    filter: "美国"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇬🇧 英国"
    type: url-test
    use:
      - Company-Profile
    filter: "英国"
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # 兜底规则：可手动选择任意分组/节点（含自动选择）
  - name: "🎯 兜底规则"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🌏 亚洲"
      - "🇯🇵 日本"
      - "🇭🇰 香港"
      - "🇸🇬 新加坡"
      - "🇰🇷 韩国"
      - "🇨🇳 台湾"
      - "🇺🇸 美国"
      - "🇬🇧 英国"
      - "DIRECT"

