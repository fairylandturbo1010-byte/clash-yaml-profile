# ============================================================
#  Clash YAML Profile
#  个人 Clash 分流配置（适用于 Clash Meta / Mihomo 内核）
#
#  【分流策略】规则从上到下匹配，优先级如下
#   1. Adobe 全家桶         → 断网（REJECT / 🛑 Block）
#   2. 内网 / 本地流量       → 直连
#   3. AI 服务              → OpenAI / Claude / Gemini 各自分组，默认美国节点
#   4. 流媒体               → 默认亚洲节点（日/港/新/韩/台）
#   5. 中国大陆网站与 IP     → 直连
#   6. 其他未命中流量        → 🚀 Node Select（可手动切换）
#
#   ⚠️ 美国节点默认仅提供给 AI 服务，降低频繁切换地区带来的账号风控风险
#   ⚠️ 所有分组名称均为英文（规则以英文逗号分隔，组名内禁止出现逗号）
#
#  【适用客户端】
#   Clash Verge Rev / Mihomo Party / FlClash / Clash Meta
# ============================================================

# ---------- 基础设置 ----------
mixed-port: 7890          # 代理端口（HTTP / SOCKS5 共用）
allow-lan: false          # 是否允许局域网内其他设备连接
mode: rule                # 分流模式
log-level: info
ipv6: false
unified-delay: true       # 统一延迟显示（测速结果更接近真实体验）
tcp-concurrent: true      # TCP 并发连接，加快首包响应
# external-controller: 127.0.0.1:9090   # 如需 Web 控制面板可取消注释

# 记住节点选择（客户端重启后保持之前的节点选择）
profile:
  store-selected: true
  store-fake-ip: true

# ---------- DNS 设置 ----------
dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  fallback:
    - 1.1.1.1
    - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
      - "+.openai.com"
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "time.windows.com"
    - "time.nist.gov"
    - "time.apple.com"
  nameserver-policy:
    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29

# ============================================================
#  >>>>>>>>>>>>>>>>>>  订阅链接填写位置  <<<<<<<<<<<<<<<<<<<<
#  更换机场时，只改下面 url 这一行即可，其余内容无需改动
#  interval: 订阅更新间隔（秒），172800 = 48 小时 = 每 2 天更新一次
# ============================================================
proxy-providers:
  Provider:
    type: http
    url: "https://liangxin.xyz/api/v1/liangxin?OwO=6d6fd6109c7631b213e1a320ef1645db"
    interval: 172800
    path: ./providers/provider.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

# ---------- 代理组 ----------
proxy-groups:
  # 默认出口：所有未命中国内规则的国外流量都从这里走
  - name: 🚀 Node Select
    type: select
    proxies:
      - ♻️ Auto Select
      - 🌏 Asia
      - 🇯🇵 Japan
      - 🇭🇰 Hong Kong
      - 🇸🇬 Singapore
      - 🇰🇷 South Korea
      - 🇨🇳 Taiwan(China)
      - 🇺🇸 United States
      - 🇬🇧 United Kingdom
      - 🌍 Streaming
      - 🤖 AI
      - 🎯 CN Direct
      - 🛑 Block
    use:
      - Provider

  # 自动测速，选择延迟最低的节点
  - name: ♻️ Auto Select
    type: url-test
    use:
      - Provider
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # ---------- 地区节点池（按国家/地区细分） ----------
  # 通过 filter 正则匹配节点名称自动归组，自动选该地区延迟最低的节点
  # 若订阅里地区命名不同，改对应的正则即可

  # 亚洲汇总：Japan / Hong Kong / Singapore / South Korea / Taiwan
  - name: 🌏 Asia
    type: url-test
    use:
      - Provider
    filter: '(?i)日本|香港|新加坡|韩国|台湾|台灣|Japan|Hong ?Kong|Singapore|Korea|Taiwan'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇯🇵 Japan
    type: url-test
    use:
      - Provider
    filter: '(?i)\bJP\b|日本|东京|大阪|名古屋|Japan|Tokyo|Osaka|Nagoya'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇭🇰 Hong Kong
    type: url-test
    use:
      - Provider
    filter: '(?i)\bHK\b|香港|Hong ?Kong'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇸🇬 Singapore
    type: url-test
    use:
      - Provider
    filter: '(?i)\bSG\b|新加坡|狮城|Singapore'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇰🇷 South Korea
    type: url-test
    use:
      - Provider
    filter: '(?i)\bKR\b|韩国|首尔|Korea|Seoul'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇨🇳 Taiwan(China)
    type: url-test
    use:
      - Provider
    filter: '(?i)\bTW\b|台湾|台灣|台北|Taiwan|Taipei'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇺🇸 United States
    type: url-test
    use:
      - Provider
    filter: '(?i)\bUS\b|\bUSA\b|美国|美西|美东|洛杉矶|圣何塞|硅谷|纽约|达拉斯|Los Angeles|San Jose|Silicon|New York|Dallas'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: 🇬🇧 United Kingdom
    type: url-test
    use:
      - Provider
    filter: '(?i)\bUK\b|\bGB\b|英国|伦敦|United Kingdom|Britain|London'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # ---------- 用途分组 ----------

  # 流媒体专用：默认亚洲节点，可手动切 Japan / Hong Kong / Singapore / Auto Select / Direct
  - name: 🌍 Streaming
    type: select
    proxies:
      - 🌏 Asia
      - 🇯🇵 Japan
      - 🇭🇰 Hong Kong
      - 🇸🇬 Singapore
      - ♻️ Auto Select
      - 🎯 CN Direct

  # AI 通用出口：默认美国节点
  - name: 🤖 AI
    type: select
    proxies:
      - 🇺🇸 United States
      - ♻️ Auto Select

  # OpenAI / ChatGPT —— 官方不支持香港，故不提供香港选项
  - name: 🤖 OpenAI
    type: select
    proxies:
      - 🇺🇸 United States   # 默认
      - 🇯🇵 Japan
      - 🇸🇬 Singapore
      - 🇰🇷 South Korea
      - 🇨🇳 Taiwan(China)
      - 🇬🇧 United Kingdom
      - ♻️ Auto Select

  # Anthropic / Claude —— 官方不支持香港，故不提供香港选项
  - name: 🤖 Claude
    type: select
    proxies:
      - 🇺🇸 United States   # 默认
      - 🇬🇧 United Kingdom
      - 🇯🇵 Japan
      - 🇸🇬 Singapore
      - 🇰🇷 South Korea
      - 🇨🇳 Taiwan(China)
      - ♻️ Auto Select

  # Google Gemini —— 官方支持香港，故保留香港选项
  - name: 🤖 Gemini
    type: select
    proxies:
      - 🇺🇸 United States   # 默认
      - 🇬🇧 United Kingdom
      - 🇯🇵 Japan
      - 🇭🇰 Hong Kong
      - 🇸🇬 Singapore
      - 🇰🇷 South Korea
      - 🇨🇳 Taiwan(China)
      - ♻️ Auto Select

  # 国内直连
  - name: 🎯 CN Direct
    type: select
    proxies:
      - DIRECT

  # 拦截（Adobe 断网）
  - name: 🛑 Block
    type: select
    proxies:
      - REJECT

# ---------- 分流规则（从上到下匹配，顺序很重要） ----------
rules:
  # ===== 1. Adobe 全家桶：全部断网（优先级最高） =====
  # 注意：以下规则会拦截所有 Adobe 域名，应用将完全无法联网；
  #       若日后购买了正版 Adobe，请删除本段规则。
  # 关键词兜底：任何域名只要含 "adobe" 字样一律拦截（最彻底的兜底）
  - DOMAIN-KEYWORD,adobe,🛑 Block
  # ---- Adobe 主域名 ----
  - DOMAIN-SUFFIX,adobe.com,🛑 Block
  - DOMAIN-SUFFIX,adobe.net,🛑 Block
  - DOMAIN-SUFFIX,adobe.io,🛑 Block
  - DOMAIN-SUFFIX,adobe-dns.com,🛑 Block
  - DOMAIN-SUFFIX,adobelogin.com,🛑 Block
  - DOMAIN-SUFFIX,adobess.com,🛑 Block
  - DOMAIN-SUFFIX,adobegenuine.com,🛑 Block
  - DOMAIN-SUFFIX,adobespark.com,🛑 Block
  - DOMAIN-SUFFIX,adobestock.com,🛑 Block
  - DOMAIN-SUFFIX,adobefonts.com,🛑 Block
  - DOMAIN-SUFFIX,adobeconnect.com,🛑 Block
  - DOMAIN-SUFFIX,adobeexchange.com,🛑 Block
  - DOMAIN-SUFFIX,adobecqms.net,🛑 Block
  - DOMAIN-SUFFIX,adobedtm.com,🛑 Block
  - DOMAIN-SUFFIX,adobestatic.com,🛑 Block
  - DOMAIN-SUFFIX,adobecc.com,🛑 Block
  - DOMAIN-SUFFIX,creativecloud.com,🛑 Block
  # ---- Adobe 关联 / 收购产品 ----
  - DOMAIN-SUFFIX,behance.net,🛑 Block
  - DOMAIN-SUFFIX,behance.com,🛑 Block
  - DOMAIN-SUFFIX,photoshop.com,🛑 Block
  - DOMAIN-SUFFIX,magento.com,🛑 Block
  - DOMAIN-SUFFIX,marketo.com,🛑 Block
  - DOMAIN-SUFFIX,echosign.com,🛑 Block
  - DOMAIN-SUFFIX,typekit.com,🛑 Block
  - DOMAIN-SUFFIX,typekit.net,🛑 Block
  - DOMAIN-SUFFIX,scene7.com,🛑 Block
  # ---- Adobe Analytics / 数据追踪 ----
  - DOMAIN-SUFFIX,omniture.com,🛑 Block
  - DOMAIN-SUFFIX,omtrdc.net,🛑 Block
  - DOMAIN-SUFFIX,demdex.net,🛑 Block
  - DOMAIN-SUFFIX,everesttech.net,🛑 Block
  - DOMAIN-SUFFIX,2o7.net,🛑 Block
  - DOMAIN-SUFFIX,adobestats.io,🛑 Block

  # ===== 2. 内网 / 本地流量直连 =====
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve

  # ===== 3. AI 服务：各自专属分组，默认美国节点 =====
  # OpenAI / ChatGPT（不支持香港）
  - GEOSITE,openai,🤖 OpenAI
  - DOMAIN-SUFFIX,openai.com,🤖 OpenAI
  - DOMAIN-SUFFIX,chatgpt.com,🤖 OpenAI
  - DOMAIN-SUFFIX,oaistatic.com,🤖 OpenAI
  - DOMAIN-SUFFIX,oaiusercontent.com,🤖 OpenAI
  - DOMAIN-SUFFIX,sora.com,🤖 OpenAI
  # Anthropic / Claude（不支持香港）
  - DOMAIN-SUFFIX,anthropic.com,🤖 Claude
  - DOMAIN-SUFFIX,claude.ai,🤖 Claude
  - DOMAIN-SUFFIX,claudeusercontent.com,🤖 Claude
  # Google Gemini（支持香港）
